name: MCP catalog check

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths: ["skills/setup/mcp-catalog.json", "scripts/check_mcp_catalog.py"]

permissions:
  contents: read
  issues: write
  actions: write   # to keep this scheduled workflow enabled

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check catalog entries
        run: |
          set -o pipefail
          python3 scripts/check_mcp_catalog.py | tee report.txt

      - name: Open an issue if something broke
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="MCP catalog: entries need updating"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            { echo "The weekly check found catalog entries that no longer work:"; echo; echo '```'; cat report.txt; echo '```'; } > body.md
            gh issue create --title "$title" --body-file body.md
          fi

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow on every run keeps it active.
      - name: Keep this weekly check enabled
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mcp-catalog.yml/enable"
