name: Setup eval

# Runs /setup for real on the sample projects in tests/fixtures/ and checks the result.
# Login, either works:
#   CLAUDE_CODE_OAUTH_TOKEN  your Claude subscription: run `claude setup-token` once and save the token as a secret
#   ANTHROPIC_API_KEY        API credits
# Without either secret the job is skipped. You can also run it on your own machine: python3 tests/eval_setup.py

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to run setup with
        default: sonnet
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC

permissions:
  contents: read
  actions: write   # to keep this scheduled workflow enabled

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HAS_LOGIN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without a login
        if: env.HAS_LOGIN != 'true'
        run: echo '::notice::Add a CLAUDE_CODE_OAUTH_TOKEN (from claude setup-token) or ANTHROPIC_API_KEY repository secret to run the setup eval.'

      - uses: actions/checkout@v7
        if: env.HAS_LOGIN == 'true'

      - uses: actions/setup-node@v7
        if: env.HAS_LOGIN == 'true'
        with:
          node-version: "24"

      - name: Install Claude Code
        if: env.HAS_LOGIN == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run setup on sample projects
        if: env.HAS_LOGIN == 'true'
        run: |
          # A token copied from a terminal often picks up a line break where the terminal wrapped it.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export ANTHROPIC_API_KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          python3 tests/eval_setup.py --model "${{ inputs.model || 'sonnet' }}"

      # /setup --defaults above skips the questions, so check them separately in a read-only dry run.
      - name: Check setup questions on sample projects
        if: env.HAS_LOGIN == 'true' && !cancelled()
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export ANTHROPIC_API_KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          python3 tests/eval_questions.py --model "${{ inputs.model || 'sonnet' }}"

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow on every run keeps it active.
      - name: Keep this weekly check enabled
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/eval-setup.yml/enable"
