name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION and plugin.json
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(cat VERSION)" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($(cat VERSION))"; exit 1
          fi
          plugin=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [ "$plugin" != "$(cat VERSION)" ]; then
            echo "::error::.claude-plugin/plugin.json has version $plugin, VERSION has $(cat VERSION)"; exit 1
          fi

      - name: Run tests
        run: python3 tests/test_kit.py

      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
