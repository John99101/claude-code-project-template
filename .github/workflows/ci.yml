name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint installer
        if: runner.os == 'Linux'
        run: shellcheck -S warning install.sh

      - name: Run tests
        run: python3 tests/test_kit.py -v

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "20"

      - name: Validate plugin and marketplace
        if: runner.os == 'Linux'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
