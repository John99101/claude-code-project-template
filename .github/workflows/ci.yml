name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python tests/test_kit.py -v

      - name: Lint and try the macOS/Linux launcher
        if: runner.os != 'Windows'
        run: |
          if command -v shellcheck >/dev/null; then shellcheck install.sh; fi
          mkdir -p "$RUNNER_TEMP/demo"
          sh install.sh --project "$RUNNER_TEMP/demo" --dry-run

      - name: Try the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\demo" | Out-Null
          .\install.ps1 --project "$env:RUNNER_TEMP\demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\demo\.claude\settings.json"
          .\install.ps1 --project "$env:RUNNER_TEMP\demo" --uninstall

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "20"

      - name: Validate plugin and marketplace
        if: runner.os == 'Linux'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
